<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a73e8">
<title>公考刷题 · 广东省考 / 国考 / 事业单位</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <button type="button" id="backBtn" class="icon-btn" hidden aria-label="返回">&#8592;</button>
  <h1 id="topTitle">公考刷题</h1>
  <span id="topRight" class="top-right"></span>
  <button type="button" id="helpBtn" class="icon-btn help-btn" aria-label="使用说明">?</button>
</header>

<main id="app" class="app"></main>

<!-- 通用抽屉：答题卡 / 题目列表 / 答案与解析 / 参考要点 / 使用说明 共用 -->
<div id="sheet" class="sheet" hidden>
  <div class="sheet-panel">
    <div class="sheet-head">
      <strong id="sheetTitle">答题卡</strong>
      <button type="button" id="sheetClose" class="icon-btn" aria-label="关闭">&times;</button>
    </div>
    <div id="sheetBody" class="sheet-body"></div>
    <div id="sheetFoot" class="sheet-foot"></div>
  </div>
</div>

<script src="data/papers.js"></script>
<script src="app.js"></script>
</body>
</html>
